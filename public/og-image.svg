<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlue" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="220" cy="220" r="380" fill="url(#glowCyan)" />
  <circle cx="980" cy="420" r="420" fill="url(#glowBlue)" />

  <!-- Subtle High-tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left: Content Hierarchy -->
  <g transform="translate(100, 100)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="340" height="42" rx="21" fill="#082f49" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#38bdf8" />
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">#1 FREE SPEAKER CLEANER TOOL</text>

    <!-- Main Headline -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Clean My Speaker
    </text>
    <text x="0" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#cyanTeal)" letter-spacing="-1">
      &amp; Water Eject (165Hz)
    </text>

    <!-- Subtitle description -->
    <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Clear water droplets, remove trapped pocket dust, and fix
    </text>
    <text x="0" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      muffled smartphone audio using calibrated acoustic sound waves.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 325)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="165" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">💧 165Hz Water Eject</text>

      <!-- Tag 2 -->
      <rect x="180" y="0" width="165" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="196" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🔊 Frequency Sweep</text>

      <!-- Tag 3 -->
      <rect x="360" y="0" width="170" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="376" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">✨ No App Required</text>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="420" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="1">
      https://cleanmyspeaker.app
    </text>
  </g>

  <!-- Right: Big Graphic Emblem / Speaker Icon Visual -->
  <g transform="translate(780, 130)">
    <!-- Outer Glow Rings -->
    <circle cx="180" cy="180" r="190" fill="none" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="180" cy="180" r="160" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="8 8" />

    <!-- Card Base Squircle -->
    <rect x="20" y="20" width="320" height="320" rx="70" fill="url(#primaryGrad)" />
    <rect x="20" y="20" width="320" height="320" rx="70" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" />

    <!-- Speaker Icon Inside -->
    <g transform="translate(70, 70) scale(0.7)">
      <!-- Speaker Body -->
      <path d="M60 110 L110 110 L180 50 L180 230 L110 170 L60 170 Z" fill="#ffffff" />
      <!-- Wave 1 -->
      <path d="M210 100 C230 115 240 128 240 140 C240 152 230 165 210 180" 
            fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
      <!-- Wave 2 -->
      <path d="M245 70 C280 95 300 115 300 140 C300 165 280 185 245 210" 
            fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.85" />
    </g>

    <!-- Droplet Accent -->
    <g transform="translate(240, 20)">
      <path d="M25 0 C25 0 50 32 50 48 C50 62 39 74 25 74 C11 74 0 62 0 48 C0 32 25 0 25 0 Z" fill="#67e8f9" stroke="#ffffff" stroke-width="3" />
    </g>
  </g>
</svg>
