<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" />

  <!-- Speaker Cone / Body -->
  <g filter="url(#glow)">
    <!-- Speaker Body Polygon & Magnet Box -->
    <path d="M120 200 L180 200 L270 120 L270 392 L180 312 L120 312 Z" fill="#ffffff" />

    <!-- Wave 1 (Inner Arc) -->
    <path d="M320 206 C344 220 358 238 358 256 C358 274 344 292 320 306" 
          fill="none" stroke="url(#waveGrad)" stroke-width="28" stroke-linecap="round" />

    <!-- Wave 2 (Outer Arc) -->
    <path d="M366 164 C410 190 436 222 436 256 C436 290 410 322 366 348" 
          fill="none" stroke="url(#waveGrad)" stroke-width="28" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Water Eject Droplet (Top Right Accent) -->
  <g transform="translate(330, 80) scale(1.15)" filter="url(#glow)">
    <!-- Droplet Body -->
    <path d="M40 0 C40 0 80 48 80 75 C80 97 62 115 40 115 C18 115 0 97 0 75 C0 48 40 0 40 0 Z" 
          fill="url(#dropGrad)" stroke="#ffffff" stroke-width="5" />
    <!-- Droplet Specular Reflection Highlight -->
    <ellipse cx="28" cy="70" rx="9" ry="18" transform="rotate(-30 28 70)" fill="#ffffff" opacity="0.65" />
  </g>

  <!-- Small Splash Sparkle Beads -->
  <circle cx="430" cy="80" r="10" fill="#a5f3fc" />
  <circle cx="455" cy="125" r="7" fill="#67e8f9" />
</svg>
